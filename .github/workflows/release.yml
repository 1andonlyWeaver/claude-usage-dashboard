# Builds ClaudeUsageDashboard.exe and its installer on a clean Windows runner, then installs,
# smoke-tests and uninstalls that installer.
# - A pushed release tag (a bare number such as 2.0.0, equal to version.py) also creates a
#   draft GitHub release with the installer attached. Try it, then publish the draft by hand:
#   installed copies don't see a release until it's published.
# - A pull request that touches the build runs everything except the tag check and the release.
# - Installed copies install a release themselves only once its .sig is on it: sign the draft's
#   installer on the maintainer's PC (packaging/sign.py) before publishing. The workflow never
#   holds the signing key.
name: Build and release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'requirements.txt'
      - 'desktop.py'
      - 'updates.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read the version
        id: version
        run: |
          $number = python -c "import version; print(version.__version__)"
          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Check the tag matches version.py
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          if ($env:TAG -ne $env:VERSION) {
            Write-Error "Tag $env:TAG doesn't match version.py ($env:VERSION). Fix one, then tag again."
            exit 1
          }
          $key = python -c "import updates; print(updates.SIGNING_KEY)"
          if (-not $key) {
            Write-Error "updates.SIGNING_KEY is empty, so this release couldn't update itself later. Run python packaging/sign.py new-key, commit, then tag again."
            exit 1
          }

      - name: Install the packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt pytest==9.1.1 httpx2==2.13.1

      - name: Run the tests
        run: python -m pytest -q

      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean packaging/ClaudeUsageDashboard.spec

      - name: Smoke-test the build
        run: |
          $p = Start-Process -FilePath dist\ClaudeUsageDashboard\ClaudeUsageDashboard.exe -ArgumentList '--smoke' -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'ClaudeUsageDashboard\logs\dashboard.log'
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.ExitCode -ne 0) { Write-Error "--smoke exited with $($p.ExitCode)"; exit 1 }

      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.3 -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, smoke-test and uninstall
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $setup = "dist\ClaudeUsageDashboard-Setup-$env:VERSION.exe"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startatlogin' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Setup exited with $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Claude Usage Dashboard'
          $exe = Join-Path $app 'ClaudeUsageDashboard.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $run = (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).ClaudeUsageDashboard
          if ($run -ne "`"$exe`" --background") { Write-Error "The Run value is [$run]"; exit 1 }
          # An upgrade leaves Start at login as it was. While it's on, install again: it's unchanged
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "The upgrade exited with $($p.ExitCode)"; exit 1 }
          $run = (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).ClaudeUsageDashboard
          if ($run -ne "`"$exe`" --background") { Write-Error "The upgrade changed Start at login to [$run]"; exit 1 }
          # Turned off (as the tray does), install again: it stays off
          Remove-ItemProperty $runKey -Name ClaudeUsageDashboard
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "The upgrade exited with $($p.ExitCode)"; exit 1 }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).ClaudeUsageDashboard) {
            Write-Error 'The upgrade turned Start at login back on'; exit 1
          }
          Set-ItemProperty $runKey -Name ClaudeUsageDashboard -Value "`"$exe`" --background"  # back on, so the uninstall check below means something
          $p = Start-Process $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "The installed app's --smoke exited with $($p.ExitCode)"; exit 1 }
          # Install update: the app starts Setup with /UPDATE and its pid, then quits. Here it
          # doesn't quit, so Setup must wait, end it after 30 s, upgrade, and start it again in the tray
          $runtime = Join-Path $env:LOCALAPPDATA 'ClaudeUsageDashboard\data\runtime.json'
          $setupLog = Join-Path $env:RUNNER_TEMP 'update-setup.log'
          Start-Process $exe -ArgumentList '--background'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $runtime); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $runtime)) { Write-Error "The app didn't start in the tray"; exit 1 }
          $old = (Get-Content $runtime -Raw | ConvertFrom-Json).pid
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/UPDATE=background', "/PID=$old", "/LOG=$setupLog" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $setupLog -Tail 40; Write-Error "The update exited with $($p.ExitCode)"; exit 1 }
          if (Get-Process -Id $old -ErrorAction SilentlyContinue) { Write-Error 'The update left the old app running'; exit 1 }
          $new = $null
          for ($i = 0; $i -lt 60 -and -not $new; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $runtime) {
              $new = (Get-Content $runtime -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json).pid
              if ($new -eq $old) { $new = $null }
            }
          }
          if (-not $new) { Get-Content $setupLog -Tail 40; Write-Error "The update didn't start the app again"; exit 1 }
          $cmd = (Get-CimInstance Win32_Process -Filter "ProcessId = $new").CommandLine
          if ($cmd -notlike '*--background*') { Write-Error "The update started the app as [$cmd]"; exit 1 }
          Stop-Process -Id $new -Force
          for ($i = 0; $i -lt 10 -and (Get-Process -Id $new -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { Write-Error 'The uninstaller left the app behind'; exit 1 }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).ClaudeUsageDashboard) {
            Write-Error 'The uninstaller left the Run value behind'; exit 1
          }

      - name: Create a draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG "dist\ClaudeUsageDashboard-Setup-$env:TAG.exe" --draft --title $env:TAG --generate-notes
